<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mehedi Hasan - Curriculum Vitae</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e24;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .header-bar h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .btn-download {
      background-color: #2563eb;
      color: #ffffff;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }
    .btn-download:hover {
      background-color: #1d4ed8;
    }
    .pdf-container {
      width: 100%;
      height: calc(100vh - 53px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>Mehedi Hasan — Curriculum Vitae</h1>
    <a href="Mehedi_Hasan_CV.pdf" download="Mehedi_Hasan_CV.pdf" class="btn-download">Download PDF</a>
  </div>

  <div class="pdf-container">
    <iframe src="Mehedi_Hasan_CV.pdf" type="application/pdf">
      <p>Your browser does not support inline PDFs. <a href="Mehedi_Hasan_CV.pdf">Click here to download the PDF</a>.</p>
    </iframe>
  </div>

</body>
</html>
